<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>뷰티 트렌드 — 오늘 뜨는 브랜드</title>
  <meta name="description" content="올리브영 뷰티 브랜드의 인기가 언제, 왜 올랐는지 보여 줘요.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='9' fill='%23e4573d'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <script type="module" crossorigin src="./assets/home-Cttvp9x6.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/shared-j7yi7s4Z.js">
  <link rel="stylesheet" crossorigin href="./assets/style-DasiP_NE.css">
</head>
<body>
  <header class="top">
    <div class="top__in">
      <a class="logo" href="./">뷰티<i>.</i>트렌드</a>
      <span class="top__meta" id="meta"></span>
    </div>
  </header>

  <main class="wrap">
    <section class="hero">
      <p class="hero__kicker">브랜드 인기가 언제, 왜 올랐나</p>
      <form class="search search--big" id="search">
        <div class="search__row">
          <input class="search__input" type="search" name="q" placeholder="브랜드 이름" autocomplete="off" aria-label="브랜드 검색" aria-autocomplete="list" aria-controls="suggest">
          <button class="search__btn" type="submit" aria-label="검색">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          </button>
        </div>
        <div class="suggest" id="suggest" role="listbox" aria-label="브랜드 추천" hidden></div>
      </form>
      <div class="hero__chips" id="chips"></div>
    </section>

    <section class="section">
      <div class="section__head">
        <h2 class="section__title">오늘 뜨는 브랜드</h2>
        <span class="section__note">평소 = 100 · 30일 흐름</span>
      </div>
      <div class="rising" id="rising"></div>
    </section>

    <section class="section">
      <div class="section__head">
        <h2 class="section__title">오늘의 순위</h2>
        <div class="tabs" role="tablist" id="storeTabs">
          <button class="tab" type="button" role="tab" aria-selected="true" data-store="ably">에이블리</button>
          <button class="tab" type="button" role="tab" aria-selected="false" data-store="oliveyoung">올리브영</button>
        </div>
      </div>
      <div class="ranklist" id="ranklist"></div>
      <button class="more" type="button" id="more" hidden>더 보기</button>
    </section>

    <section class="section">
      <div class="section__head">
        <h2 class="section__title">전체 브랜드</h2>
        <span class="section__note" id="allNote"></span>
      </div>
      <fieldset class="filters" id="filters" aria-label="분류"></fieldset>
      <div class="brands" id="brands"></div>
      <button class="more" type="button" id="moreBrands" hidden>더 보기</button>
    </section>
  </main>

  <footer class="foot">
    <div class="foot__in" id="foot"></div>
    <div class="foot__in foot__links"><a href="./about.html">안내·개인정보처리방침</a></div>
  </footer>

</body>
</html>
