<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>뷰티 트렌드</title>
  <meta name="description" content="브랜드 트렌드 점수와 튄 날, 순위권 상품을 보여 줘요.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='9' fill='%23e4573d'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <script type="module" crossorigin src="./assets/brand-CbTH6TaE.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/shared-j7yi7s4Z.js">
  <link rel="stylesheet" crossorigin href="./assets/style-DasiP_NE.css">
</head>
<body>
  <header class="top">
    <div class="top__in">
      <a class="logo" href="./">뷰티<i>.</i>트렌드</a>
      <form class="search search--small top__search" id="search">
        <div class="search__row">
          <input class="search__input" type="search" name="q" placeholder="브랜드 이름" autocomplete="off" aria-label="브랜드 검색" aria-autocomplete="list" aria-controls="suggest">
          <button class="search__btn" type="submit" aria-label="검색">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          </button>
        </div>
        <div class="suggest" id="suggest" role="listbox" aria-label="브랜드 추천" hidden></div>
      </form>
      <span class="top__meta" id="meta"></span>
    </div>
  </header>

  <main class="wrap" id="main">
    <section class="bhead">
      <div>
        <p class="bhead__eyebrow" id="eyebrow"></p>
        <h1 class="bhead__name" id="name">불러오는 중</h1>
        <p class="bhead__rank" id="ranks"></p>
      </div>
      <div class="score" id="score"></div>
    </section>

    <section class="section">
      <div class="section__head">
        <h2 class="section__title">트렌드 점수</h2>
        <div class="seg" id="range">
          <button class="seg__btn" type="button" data-days="30" aria-pressed="false">1개월</button>
          <button class="seg__btn" type="button" data-days="90" aria-pressed="true">3개월</button>
          <button class="seg__btn" type="button" data-days="365" aria-pressed="false">1년</button>
        </div>
      </div>
      <div class="chart" id="bigChart"></div>
    </section>

    <section class="section">
      <div class="section__head">
        <h2 class="section__title">점수를 이루는 네 가지</h2>
      </div>
      <div class="parts" id="parts"></div>
    </section>

    <section class="section">
      <div class="section__head">
        <h2 class="section__title">튄 날</h2>
        <span class="section__note" id="spikeNote"></span>
      </div>
      <div class="spikes" id="spikes"></div>
    </section>

    <section class="section products">
      <div class="section__head">
        <h2 class="section__title">순위권 상품</h2>
      </div>
      <div class="ranklist" id="products"></div>
    </section>
  </main>

  <footer class="foot">
    <div class="foot__in" id="foot"></div>
    <div class="foot__in foot__links"><a href="./about.html">안내·개인정보처리방침</a></div>
  </footer>

</body>
</html>
