<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>브랜드 비교 — 뷰티 트렌드</title>
  <meta name="description" content="브랜드 트렌드 점수 비교">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='9' fill='%23e4573d'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <script type="module" crossorigin src="./assets/compare-CBdzBhvQ.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/shared-C67rVuy2.js">
  <link rel="stylesheet" crossorigin href="./assets/style-D73kj8Va.css">
</head>
<body>
  <header class="top">
    <div class="top__in">
      <a class="logo" href="./">뷰티<i>.</i>트렌드</a>
      <nav class="tabs top__tabs" aria-label="화면">
        <a class="tab" href="./">브랜드</a>
        <a class="tab" href="./method.html">점수 근거</a>
      </nav>
      <span class="top__meta" id="meta"></span>
    </div>
  </header>

  <main class="wrap">
    <section class="bhead">
      <div>
        <h1 class="bhead__name">브랜드 비교</h1>
      </div>
    </section>

    <section class="section">
      <form class="search search--small compare__search" id="search">
        <div class="search__row">
          <input class="search__input" type="search" name="q" placeholder="브랜드 더하기 (최대 5개)" autocomplete="off" aria-label="비교할 브랜드 검색" aria-autocomplete="list" aria-controls="suggest">
        </div>
        <div class="suggest" id="suggest" role="listbox" aria-label="브랜드 추천" hidden></div>
      </form>
      <div class="picked" id="picked"></div>
    </section>

    <section class="section">
      <div class="section__head">
        <h2 class="section__title">트렌드 점수</h2>
        <div class="seg" id="range">
          <button class="seg__btn" type="button" data-days="30" aria-pressed="false">1개월</button>
          <button class="seg__btn" type="button" data-days="90" aria-pressed="true">3개월</button>
          <button class="seg__btn" type="button" data-days="365" aria-pressed="false">1년</button>
        </div>
      </div>
      <div class="chart" id="chart"></div>
      <p class="failed" id="loadFailed" hidden>브랜드 자료를 못 불러왔어요 <button class="retry" type="button">다시 불러오기</button></p>
      <p class="note compare__note">브랜드마다 자기 평소를 100으로 둔 점수예요. 판매량이나 규모를 견주는 값은 아니에요.</p>
    </section>
  </main>

  <footer class="foot">
    <div class="foot__in" id="foot"></div>
    <div class="foot__in foot__links"><a href="./method.html">점수 근거</a><a href="./about.html">안내·개인정보처리방침</a></div>
  </footer>

</body>
</html>
